<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juego Cazando</title>

  <link rel="stylesheet" href="cazando.css">

</head>

<body>

  <div class="contenedor">

    <h1>🐱 Juego Cazando 🐭</h1>

    <p class="subtitulo">
      Atrapa la comida antes de que se acabe el tiempo ⏰
    </p>

    <!-- PANEL -->

    <div class="panel">

      <div class="card">
        ⭐ Puntos:
        <span id="puntos">0</span>
      </div>

      <div class="card">
        ⏰ Tiempo:
        <span id="tiempo">10</span>
      </div>

    </div>

    <!-- CANVAS -->

    <canvas id="Juego" width="600" height="400"></canvas>

    <!-- CONTROLES -->

    <div class="controles">

      <button id="btnArriba">⬆</button>

      <div>

        <button id="btnIzquierda">⬅</button>

        <button id="btnAbajo">⬇</button>

        <button id="btnDerecha">➡</button>

      </div>

      <button class="reiniciar" onclick="reiniciarJuego()">
        🔄 Reiniciar
      </button>

    </div>

    <p id="mensaje"></p>

  </div>

  <script src="cazando.js"></script>

</body>

</html>
